name: Android

# Builds the signed release APK (sideload / GitHub release) and AAB (Google Play).
# Started by hand only (scripts/publish-app.sh dispatches it): no input = test build,
# release=v1.2.3 = also a GitHub release of that tag with the APK.
# Builds are never uploaded in the clear: the artifact is encrypted with HL_ARTIFACT_KEY.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Release tag to publish with the APK (e.g. v1.0.0); empty = test build only
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Capacitor plugins + web bundle into the native project
        run: npm ci && npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Upload key
        env:
          KEYSTORE_B64: ${{ secrets.HL_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.p12"
            echo "HL_KEYSTORE=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::No HL_KEYSTORE_B64 secret: the build is debug-signed."
          fi
      - name: Build APK + AAB
        working-directory: android
        env:
          HL_KEYSTORE_PASSWORD: ${{ secrets.HL_KEYSTORE_PASSWORD }}
          HL_VERSION_CODE: ${{ github.run_number }}
        run: |
          export HL_VERSION_NAME="$(node -p "require('../app.json').version")"
          echo "Version $HL_VERSION_NAME ($HL_VERSION_CODE)"
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --console=plain -q
          cp app/build/outputs/apk/release/app-release.apk ../Huckline.apk
          cp app/build/outputs/bundle/release/app-release.aab ../Huckline.aab
          ls -l ../Huckline.apk ../Huckline.aab
      - name: Check signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs Huckline.apk | grep -i -E "certificate (DN|SHA-256)"
          "$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)" dump badging Huckline.apk | grep -E "^(package|sdkVersion|targetSdkVersion|application-label):"
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.p12"
      - name: Encrypt the builds for the artifact
        env:
          ARTIFACT_KEY: ${{ secrets.HL_ARTIFACT_KEY }}
        run: |
          test -n "$ARTIFACT_KEY" || { echo "::error::HL_ARTIFACT_KEY missing"; exit 1; }
          mkdir -p enc
          for f in Huckline.apk Huckline.aab; do
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$f" -out "enc/$f.enc" -pass env:ARTIFACT_KEY
          done
          ls -l enc
      - uses: actions/upload-artifact@v4
        with:
          name: huckline-android-encrypted
          path: enc/
          if-no-files-found: error
          retention-days: 14
      - name: Publish release
        if: inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REL: ${{ inputs.release }}
        run: |
          [[ "$REL" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::release must look like v1.2.3"; exit 1; }
          gh release delete "$REL" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$REL" Huckline.apk --target "$GITHUB_SHA" \
            --title "Huckline $REL" --notes-file RELEASE_NOTES.md --latest
